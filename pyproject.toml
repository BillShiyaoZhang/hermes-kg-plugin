[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-memory-console"
version = "0.1.0"
description = "A self-hosted, evidence-grounded memory workbench for Hermes"
requires-python = ">=3.11"
dependencies = ["neo4j==5.28.1", "rdflib==7.1.4", "tzdata==2025.2"]

[project.optional-dependencies]
console = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "fastembed==0.9.0", "onnxruntime==1.23.2", "openai>=2,<4", "PyYAML>=6,<7", "rich>=14,<16", "python-dotenv==1.2.2"]
test = ["jsonschema>=4.23,<5", "httpx>=0.27,<1", "openai>=2,<4"]

[project.scripts]
hermes-kg = "kg.console_cli:main"

[tool.setuptools]
package-dir = {kg = "plugins/kg"}
packages = ["kg"]

[tool.setuptools.package-data]
kg = ["static/*", "static/assets/*", "resources/skills/**/*"]
