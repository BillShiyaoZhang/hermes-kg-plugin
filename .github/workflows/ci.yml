name: Alpha checks
on: [push, pull_request, workflow_dispatch]
jobs:
  python:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: cdceca42e107f0e51ab9ff50e1cc881ad76b577e
          path: hermes-agent
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-console.lock jsonschema "setuptools>=75" ruamel.yaml==0.18.16
      - run: python scripts/run_tests.py -v
      - run: python -c "from kg.embedding import LocalEmbedder; import onnxruntime; print(onnxruntime.get_available_providers())"
        env:
          PYTHONPATH: plugins
  neo4j:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/local-development-password
        ports: ['7687:7687']
        options: >-
          --health-cmd "cypher-shell -u neo4j -p local-development-password 'RETURN 1'"
          --health-interval 10s --health-timeout 10s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: cdceca42e107f0e51ab9ff50e1cc881ad76b577e
          path: hermes-agent
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-console.lock jsonschema "setuptools>=75" ruamel.yaml==0.18.16
      - run: python scripts/run_tests.py -v
        env:
          KG_TEST_BOLT_URL: bolt://127.0.0.1:7687
          KG_TEST_PASSWORD: local-development-password
          KG_SEARCH_TEST_URL: bolt://127.0.0.1:7687
          KG_SEARCH_TEST_PASSWORD: local-development-password
          KG_RESEARCH_TEST_URL: bolt://127.0.0.1:7687
          KG_RESEARCH_TEST_PASSWORD: local-development-password
  frontend:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
  upstream-compatibility:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          path: hermes-agent
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-console.lock
      - run: python scripts/run_tests.py test_provenance
